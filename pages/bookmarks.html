<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookmarks</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface2: #1e2430;
    --border: #2a3040;
    --accent: #4fffb0;
    --accent2: #38bdf8;
    --accent3: #f97316;
    --text: #e2e8f0;
    --text-dim: #7c8fa8;
    --text-dimmer: #3d4f65;
    --glow: rgba(79,255,176,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,255,176,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,255,176,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .page-wrap {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 48px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 32px;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 2rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--accent);
    text-shadow: 0 0 30px var(--glow);
  }

  .count-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--surface);
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--text-dim);
    font-weight: 300;
  }

  /* Search */
  .search-wrap {
    margin-bottom: 36px;
    position: relative;
  }

  .search-wrap::before {
    content: '⌕';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.2rem;
    color: var(--text-dimmer);
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px 12px 42px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #search::placeholder { color: var(--text-dimmer); }

  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,255,176,0.1);
  }

  /* Category tabs */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 36px;
  }

  .tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .tab:hover { color: var(--text); border-color: var(--text-dimmer); }

  .tab.active {
    background: var(--accent);
    color: #0d0f14;
    border-color: var(--accent);
    font-weight: 500;
  }

  /* Category sections */
  .section {
    margin-bottom: 40px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .section-icon { font-size: 1rem; }

  .section-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .section-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-dimmer);
  }

  /* Link grid */
  .link-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
  }

  .link-card {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.15s;
    overflow: hidden;
  }

  .link-card:hover {
    border-color: var(--accent2);
    background: var(--surface2);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .link-favicon {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 2px;
    opacity: 0.8;
  }

  .link-text {
    min-width: 0;
  }

  .link-name {
    display: block;
    font-size: 0.83rem;
    color: var(--text);
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
    transition: color 0.15s;
  }

  .link-card:hover .link-name { color: var(--accent2); }

  .link-domain {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-dimmer);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }

  /* No results */
  #no-results {
    display: none;
    text-align: center;
    padding: 60px 0;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dimmer);
    font-size: 0.85rem;
  }

  /* Hidden */
  .hidden { display: none !important; }

  /* Highlight */
  mark {
    background: rgba(79,255,176,0.25);
    color: var(--accent);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="page-wrap">

  <header>
    <div class="header-top">
      <h1>// bookmarks</h1>

  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">All</div>
  </div>

  <div id="sections-wrap"></div>
  <div id="no-results">No links match your search.</div>

</div>

// ── Helpers ────────────────────────────────────────────────────────────────
function getDomain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch { return url; }
}

function getFaviconUrl(url) {
  try { const u = new URL(url); return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=32`; }
  catch { return ''; }
}

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

// ── Build UI ───────────────────────────────────────────────────────────────
const cats = [...new Set(DATA.map(d => d.cat))];
const tabsEl = document.getElementById('tabs');
const sectionsWrap = document.getElementById('sections-wrap');

// Populate total count
document.getElementById('total-count').textContent = `${DATA.length} links`;

// Build category tabs
cats.forEach(cat => {
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.dataset.cat = cat;
  tab.textContent = cat;
  tabsEl.appendChild(tab);
});

// Build sections
cats.forEach(cat => {
  const items = DATA.filter(d => d.cat === cat);
  const section = document.createElement('div');
  section.className = 'section';
  section.dataset.cat = cat;

  section.innerHTML = `
    <div class="section-header">
      <span class="section-title">${cat}</span>
      <div class="section-line"></div>
      <span class="section-count">${items.length}</span>
    </div>
    <div class="link-grid" id="grid-${cat.replace(/\W+/g,'_')}"></div>
  `;
  sectionsWrap.appendChild(section);

  const grid = section.querySelector('.link-grid');
  items.forEach(item => {
    const a = document.createElement('a');
    a.className = 'link-card';
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.dataset.name = item.name.toLowerCase();
    a.dataset.domain = getDomain(item.url).toLowerCase();
    const faviconSrc = getFaviconUrl(item.url);
    a.innerHTML = `
      <img class="link-favicon" src="${faviconSrc}" alt="" onerror="this.style.display='none'">
      <span class="link-text">
        <span class="link-name">${item.name}</span>
        <span class="link-domain">${getDomain(item.url)}</span>
      </span>
    `;
    grid.appendChild(a);
  });
});

// ── Tab filter ─────────────────────────────────────────────────────────────
let activeTab = 'all';

tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeTab = tab.dataset.cat;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === activeTab));
  applyFilters();
});

// ── Search ─────────────────────────────────────────────────────────────────
const searchEl = document.getElementById('search');
const noResults = document.getElementById('no-results');

searchEl.addEventListener('input', applyFilters);

function applyFilters() {
  const q = searchEl.value.trim().toLowerCase();
  let totalVisible = 0;

  document.querySelectorAll('.section').forEach(section => {
    const cat = section.dataset.cat;
    const catMatch = activeTab === 'all' || activeTab === cat;
    if (!catMatch) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');

    let sectionVisible = 0;
    section.querySelectorAll('.link-card').forEach(card => {
      const nameMatch = !q || card.dataset.name.includes(q) || card.dataset.domain.includes(q);
      card.classList.toggle('hidden', !nameMatch);
      if (nameMatch) {
        sectionVisible++;
        // highlight
        const nameEl = card.querySelector('.link-name');
        const originalName = DATA.find(d => d.name.toLowerCase() === card.dataset.name)?.name || card.dataset.name;
        nameEl.innerHTML = highlight(originalName, q);
      }
    });

    section.classList.toggle('hidden', sectionVisible === 0);
    totalVisible += sectionVisible;
  });

  noResults.style.display = totalVisible === 0 ? 'block' : 'none';
}
